# downloads data/buildings.json and data/walkways.json (building outlines and walkways from openstreetmap)
# runs when this file or an osm: name in js/hours.js changes; run it by hand from the actions tab if buildings change
name: update building outlines

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/buildings.yml", ".github/scripts/osm.py", "js/hours.js"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download outlines and walkways
        run: python3 .github/scripts/osm.py
      - name: commit if changed
        run: |
          git add data/buildings.json data/walkways.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "updated map data"
          git push
