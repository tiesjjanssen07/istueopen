<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin – Is the TU/e open?</title>
<link rel="icon" type="image/png" href="favicon.png">
</head>
<body>

<h1>Admin</h1>

<div id="loginBox">
  <form id="login" onsubmit="return false">
    <fieldset>
      <legend>Log in</legend>
      <p><label>Email<br><input type="email" id="email" required autocomplete="username"></label></p>
      <p><label>Password<br><input type="password" id="password" required autocomplete="current-password"></label></p>
      <p><button type="submit">Log in</button> <span id="loginStatus" role="status"></span></p>
    </fieldset>
  </form>
</div>

<div id="adminBox" hidden>
  <p>Logged in as <b id="who"></b> <button type="button" id="logout">Log out</button></p>
  <p id="adminStatus" role="status"></p>

  <h2>Reports about wrong hours (<span id="reportCount">0</span>)</h2>
  <p><small>Fix the hours in hours.js, upload it, then delete the report.</small></p>
  <div id="reports"></div>

</div>

<hr>
<p><a href="index.html">Is it open?</a> | <a href="food.html">Food</a></p>

<script>
// Shows a message if the Firebase code fails to load, instead of doing nothing.
window.addEventListener("error", function (e) {
  if (e.target && e.target.src && e.target.src.indexOf("zgo.at") !== -1) return; // visitor counter blocked by an ad blocker: harmless
  var s = document.getElementById("loginStatus");
  if (s) s.textContent = "Something failed to load: " + (e.message || (e.target && e.target.src) || "unknown error") + ". Try opening the online (GitHub Pages) version.";
}, true);
setTimeout(function () {
  var s = document.getElementById("loginStatus");
  if (!window.pageReady && s && !s.textContent) s.textContent = "The page's code didn't start. Try the online (GitHub Pages) version, or another browser.";
}, 8000);
</script>
<script src="firebase-config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, onSnapshot, doc, deleteDoc }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $ = (id) => document.getElementById(id);

if (!window.FIREBASE_CONFIG || String(window.FIREBASE_CONFIG.apiKey).startsWith("PASTE")) {
  $("loginStatus").textContent = "Setup not finished: paste your Firebase config into firebase-config.js.";
  throw new Error("Firebase config missing");
}

const app = initializeApp(window.FIREBASE_CONFIG);
const auth = getAuth(app);
const db = getFirestore(app);
let stopListening = [];

/* ---------- Login / logout ---------- */
$("login").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("loginStatus").textContent = "Logging in…";
  try {
    await signInWithEmailAndPassword(auth, $("email").value, $("password").value);
    $("loginStatus").textContent = "";
    $("password").value = "";
  } catch (err) {
    console.error(err);
    const reasons = {
      "auth/invalid-credential": "Wrong email or password.",
      "auth/wrong-password": "Wrong email or password.",
      "auth/user-not-found": "No user with this email. Add it in Firebase: Authentication → Users.",
      "auth/invalid-email": "That doesn't look like an email address.",
      "auth/operation-not-allowed": "Email/Password sign-in isn't enabled. Turn it on in Firebase: Authentication → Sign-in method.",
      "auth/configuration-not-found": "Authentication isn't set up yet. In Firebase, open Authentication and click Get started, then enable Email/Password.",
      "auth/invalid-api-key": "The apiKey in firebase-config.js is wrong. Copy the config again from Project settings.",
      "auth/api-key-not-valid.-please-pass-a-valid-api-key.": "The apiKey in firebase-config.js is wrong. Copy the config again from Project settings.",
      "auth/unauthorized-domain": "This website's domain isn't allowed. Add it in Firebase: Authentication → Settings → Authorized domains.",
      "auth/network-request-failed": "Couldn't reach Firebase. Check your internet connection, or try the online version instead of the file on your computer.",
      "auth/too-many-requests": "Too many attempts. Wait a few minutes and try again."
    };
    $("loginStatus").textContent = (reasons[err.code] || "Login failed.") + " (" + err.code + ")";
  }
});
$("logout").addEventListener("click", () => signOut(auth));

onAuthStateChanged(auth, (user) => {
  stopListening.forEach((stop) => stop());
  stopListening = [];
  $("loginBox").hidden = !!user;
  $("adminBox").hidden = !user;
  if (!user) return;
  $("who").textContent = user.email;
  $("adminStatus").textContent = "";
  stopListening.push(watchReports());
});

/* ---------- Message lists ---------- */
function watchReports() {
  const box = $("reports");
  box.replaceChildren(text("p", "Loading…"));
  return onSnapshot(collection(db, "reports"), (snap) => {
    const list = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort(newestFirst);
    $("reportCount").textContent = list.length;
    box.replaceChildren();
    if (list.length === 0) { box.append(text("p", "No reports. 🎉")); return; }
    const ul = document.createElement("ul");
    for (const r of list) {
      const li = document.createElement("li");
      li.append(text("b", r.place + ": "), r.text + " ");
      if (r.createdAt?.toDate) li.append(text("small", "(" + r.createdAt.toDate().toLocaleString() + ") "));
      li.append(button("Delete", async () => {
        try { await deleteDoc(doc(db, "reports", r.id)); }
        catch (err) { console.error(err); $("adminStatus").textContent = "Deleting failed: " + err.code; }
      }));
      ul.append(li);
    }
    box.append(ul);
  }, (err) => { console.error(err); box.replaceChildren(text("p", "Couldn't load reports (" + err.code + "). Did you publish the new firestore.rules?")); });
}

function newestFirst(a, b) {
  return (b.createdAt?.toMillis?.() ?? 0) - (a.createdAt?.toMillis?.() ?? 0);
}
function text(tag, s) { const el = document.createElement(tag); el.textContent = s; return el; }
function button(label, onClick) {
  const b = document.createElement("button"); b.type = "button"; b.textContent = label;
  b.addEventListener("click", onClick); return b;
}
</script>
</body>
</html>
